<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB89C"/>
      <stop offset="100%" stop-color="#3E7A5E"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F4030" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <g filter="url(#soft-shadow)">
    <!-- chimney -->
    <rect x="292" y="140" width="24" height="48" rx="4" fill="#FBF3E7"/>

    <!-- roof (rounded, slight overhang) -->
    <path d="M256 122
             C259 122 262 123 264 125
             L364 210
             C370 215 366 226 358 226
             L346 226
             L346 232
             L166 232
             L166 226
             L154 226
             C146 226 142 215 148 210
             L248 125
             C250 123 253 122 256 122 Z"
          fill="#FBF3E7"/>

    <!-- house body -->
    <rect x="176" y="230" width="160" height="112" rx="14" fill="#FBF3E7"/>

    <!-- door -->
    <rect x="230" y="272" width="36" height="70" rx="10" fill="#3E7A5E"/>
    <circle cx="256" cy="308" r="2.6" fill="#FBF3E7"/>

    <!-- window -->
    <rect x="284" y="268" width="38" height="38" rx="8" fill="#3E7A5E"/>
    <line x1="303" y1="268" x2="303" y2="306" stroke="#FBF3E7" stroke-width="3.5"/>
    <line x1="284" y1="287" x2="322" y2="287" stroke="#FBF3E7" stroke-width="3.5"/>
  </g>
</svg>
