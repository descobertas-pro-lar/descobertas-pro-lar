<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B9BD5"/>
      <stop offset="100%" stop-color="#2E5D8A"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#12263B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="#FF7A3D" stroke-width="16"/>

  <g filter="url(#soft-shadow)" transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <!-- shopping bag -->
    <path d="M180 210
             L332 210
             L346 372
             C347 384 338 394 326 394
             L186 394
             C174 394 165 384 166 372
             Z"
          fill="#FF7A3D"/>

    <!-- bag handles -->
    <path d="M206 210 L206 178 C206 152 228 132 256 132 C284 132 306 152 306 178 L306 210"
          fill="none" stroke="#FF7A3D" stroke-width="16" stroke-linecap="round"/>

    <!-- bag fold line -->
    <line x1="180" y1="238" x2="332" y2="238" stroke="#2E5D8A" stroke-width="6" opacity="0.15"/>

    <!-- magnifying glass -->
    <circle cx="270" cy="300" r="42" fill="none" stroke="#2E5D8A" stroke-width="14"/>
    <line x1="300" y1="330" x2="336" y2="366" stroke="#2E5D8A" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
