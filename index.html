<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo_descobertas.png">
<title>🏠 Descobertas pro Lar — Achadinhos da Semana</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #F4F8FC 0%, #DCE9F5 40%, #5B9BD5 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  @media (min-width: 700px) {
    .container { max-width: 600px; }
  }

  @media (min-width: 1000px) {
    .container { max-width: 720px; }
  }

  @media (max-width: 380px) {
    .container { max-width: 100%; }
  }

  .avatar {
    width: clamp(80px, 14vw, 110px);
    height: clamp(80px, 14vw, 110px);
    border-radius: 50%;
    box-shadow: 0 12px 38px rgba(255, 122, 61, 0.72);
    margin-bottom: 14px;
    border: 4px solid #fff;
  }

  h1 {
    font-size: clamp(17px, 2.4vw, 23px);
    font-weight: 700;
    color: #1E3A54;
    margin-bottom: 4px;
  }

  .bio {
    font-size: clamp(12px, 1.6vw, 15px);
    color: #4A7295;
    text-align: center;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  .updated {
    font-size: 11px;
    color: #6E93B8;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4CAF50;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.6); }
    70% { box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
    100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
  }

  /* Weekly deals card */
  .weekly-card {
    width: 100%;
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 34px rgba(255, 122, 61, 0.56);
    border: 1px solid rgba(46, 93, 138, 0.15);
    margin-bottom: 16px;
  }

  .weekly-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: clamp(17px, 2.2vw, 21px);
    font-weight: 700;
    color: #FF7A3D;
    margin-bottom: 14px;
  }

  .weekly-title-text {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .weekly-share-btn {
    background: #F4F8FC;
    border: 1px solid rgba(46, 93, 138, 0.25);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .weekly-share-btn:active {
    background: #DCE9F5;
  }

  .weekly-share-btn svg { width: 14px; height: 14px; }

  .fire {
    font-size: 16px;
    display: inline-block;
    animation: flicker 1.4s infinite ease-in-out;
  }

  @keyframes flicker {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.15) rotate(-4deg); }
  }

  /* Category tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .tab {
    flex-shrink: 0;
    font-size: 11.5px;
    font-weight: 600;
    color: #4A7295;
    background: #F4F8FC;
    border: 1px solid rgba(46, 93, 138, 0.2);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .tab.active {
    background: #2E5D8A;
    color: #fff;
    border-color: #2E5D8A;
  }

  .weekly-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .deal-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: #F4F8FC;
    border-radius: 14px;
    padding: 12px 6px;
    transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid rgba(46, 93, 138, 0.1);
    cursor: pointer;
    --card-bg: #F4F8FC;
    overflow: hidden;
  }

  @media (hover: hover) {
    .deal-item:hover {
      background: #FFEBD9;
      border-color: rgba(255, 122, 61, 0.5);
      box-shadow: 0 4px 14px rgba(255, 122, 61, 0.2);
      --card-bg: #FFEBD9;
    }
  }

  .deal-item:active {
    transform: scale(0.95);
  }

  .deal-item.hidden {
    display: none;
  }

  .deal-icon {
    width: clamp(70px, 9vw, 100px);
    height: clamp(70px, 9vw, 100px);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    overflow: hidden;
    padding: 6px;
    transition: width 0.25s ease, height 0.25s ease, background 0.2s ease;
    background: var(--card-bg);
  }

  @media (hover: hover) {
    .deal-item:hover .deal-icon {
      width: clamp(95px, 12vw, 130px);
      height: clamp(95px, 12vw, 130px);
    }
  }

  .deal-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    mix-blend-mode: multiply;
  }

  .deal-name {
    font-size: clamp(10.5px, 1.3vw, 13px);
    font-weight: 600;
    color: #1E3A54;
    text-align: center;
    line-height: 1.3;
  }

  .price-row {
    display: flex;
    align-items: baseline;
    gap: 4px;
    margin-top: 4px;
  }

  .price-old {
    font-size: 9.5px;
    color: #6E93B8;
    text-decoration: line-through;
  }

  .price-new {
    font-size: clamp(10.5px, 1.3vw, 13px);
    color: #FF7A3D;
    font-weight: 700;
  }

  .views {
    font-size: 8.5px;
    color: #6E93B8;
    margin-top: 3px;
  }


  .deal-icon svg { width: 22px; height: 22px; }
  .link-icon svg { width: 22px; height: 22px; }

  /* Regular link list */
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: #4A7295;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 4px 0 2px 4px;
    align-self: flex-start;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    border-radius: 16px;
    padding: 15px 18px;
    text-decoration: none;
    box-shadow: 0 8px 26px rgba(255, 122, 61, 0.46);
    transition: transform 0.15s ease;
    border: 1px solid rgba(46, 93, 138, 0.12);
  }

  .link-card:active {
    transform: scale(0.97);
  }

  .link-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .icon-shopee { background: #FFE9DC; }
  .icon-magalu { background: #E4EEF8; }
  .icon-lomadee { background: #E8F5E9; }
  .icon-insta { background: #E4EEF8; }

  .link-text {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .link-title {
    font-size: 14.5px;
    font-weight: 600;
    color: #1E3A54;
  }

  .link-sub {
    font-size: 11.5px;
    color: #6E93B8;
    margin-top: 2px;
  }

  /* Newsletter opt-in */
  .newsletter {
    width: 100%;
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    margin-top: 20px;
    text-align: center;
    box-shadow: 0 8px 26px rgba(255, 122, 61, 0.46);
    border: 1px solid rgba(46, 93, 138, 0.12);
  }

  .newsletter-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #1E3A54;
    margin-bottom: 4px;
  }

  .newsletter-sub {
    font-size: 11.5px;
    color: #6E93B8;
    margin-bottom: 12px;
  }

  .newsletter-form {
    display: flex;
    gap: 8px;
  }

  .newsletter-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(46, 93, 138, 0.25);
    font-size: 12.5px;
    outline: none;
  }

  .newsletter-btn {
    background: #2E5D8A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #6E93B8;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="container">
    <img class="avatar" src="logo_descobertas.png" alt="descobertas.pro.lar">
    <h1>descobertas.pro.lar</h1>
    <p class="bio">🏠 achadinhos que facilitam sua rotina<br>✨ produtos testados, preço bom</p>
    <div class="updated"><span class="dot"></span> Atualizado hoje</div>

    <!-- Weekly deals card -->
    <div class="weekly-card">
      <div class="weekly-title">
        <div class="weekly-title-text"><svg class="fire" viewBox="0 0 24 24" width="21" height="21" fill="#FF7A3D" stroke="none"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-.5-2 2 1 3.5 3.5 3.5 6a7 7 0 1 1-14 0c0-4 2-6 3-8 .5-1 1.5-2 2-3z"/></svg> Top 9 da Semana!</div>
        <button class="weekly-share-btn" onclick="shareTop9()">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E5D8A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

      <div class="weekly-grid" id="weekly-grid"></div>
    </div>

    <!-- Remaining links -->
    <div class="links">

      <a class="link-card" href="https://www.magazinevoce.com.br/magazinedescobertaslar/" target="_blank">
        <div class="link-icon icon-magalu"><svg viewBox="0 0 24 24" fill="none" stroke="#E85D75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 12 2l9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg></div>
        <div class="link-text">
          <div class="link-title">Ver Todas as Ofertas Magalu</div>
          <div class="link-sub">Eletros e casa</div>
        </div>
      </a>

      <a class="link-card" href="https://www.instagram.com/descobertas.pro.lar/" target="_blank">
        <div class="link-icon icon-insta"><svg viewBox="0 0 24 24" fill="none" stroke="#D1477A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg></div>
        <div class="link-text">
          <div class="link-title">Seguir no Instagram</div>
          <div class="link-sub">@descobertas.pro.lar</div>
        </div>
      </a>
    </div>


    <footer>© descobertas.pro.lar</footer>
  </div>

  <script>
    // =====================================================================
    // EDITE SÓ AQUI: 9 produtos da semana.
    // Campos: name (nome curto), image (URL da foto do produto),
    // price_old (opcional), price_new, url (link de afiliado real)
    // =====================================================================
    const products = [
      { name: "Organizador Giratório Paramount 18/23cm", image: "https://a-static.mlcdn.com.br/800x560/organizador-giratorio-multiuso-paramount-elegance-acrilico-cristal-18-cm-e-23-cm/zuhausecasaedecoracao/215-505/c4ba1aeb5a3992fe155cd6ede40cce84.jpeg", price_new: "R$36,90", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/organizador-giratorio-multiuso-paramount-elegance-acrilico-cristal-18-cm-e-23-cm/p/ffdjh525c4/ud/orgm/?seller_id=zuhausecasaedecoracao" },
      { name: "Descascador de Legumes Aço Inox", image: "https://a-static.mlcdn.com.br/800x560/descascador-de-legumes-em-aco-inoxidavel-com-cabo-de-madeira-para-descascar-e-fatiar-frutas-e-none/aliexpress/2012540066/b30e338436e5c8bf8bcb257439dc900c.jpeg", price_new: "R$57,45", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/descascador-de-legumes-em-aco-inoxidavel-com-cabo-de-madeira-para-descascar-e-fatiar-frutas-e-none/p/ce48ck503k/ud/dscf/?seller_id=aliexpress" },
      { name: "Picador de Alho Elétrico Sem Fio", image: "https://a-static.mlcdn.com.br/800x560/picador-de-alho-eletrico-sem-fio-mini-processador-de-alimentos-cebola-chopper-gadgets-de-cozinha/novoorientalvariedadesltda/9b783370fb8b11ecb79b4201ac185079/49c6d1659aa65b9b0e074a7d1b6076a1.jpeg", price_new: "R$47,50", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/picador-de-alho-eletrico-sem-fio-mini-processador-de-alimentos-cebola-chopper-gadgets-de-cozinha/p/ek9j58dhj7/ep/prsa/?seller_id=novoorientalvariedadesltda" },
      { name: "Organizador Multiuso Nitron", image: "https://a-static.mlcdn.com.br/800x560/organizador-de-armario-ou-parede-criativo-multiuso-cor-preto-nitron/almadaterracomerciodeprodutosdiv/ntr00028ormcpr/a001ffef4dfe3e7ea9c0bb233a245867.jpeg", price_new: "R$32,97", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/organizador-de-armario-ou-parede-criativo-multiuso-cor-preto-nitron/p/fa828a4f1k/ud/orgm/?seller_id=almadaterracomerciodeprodutosdiv" },
      { name: "Kit Utensílios Silicone MK 12pç", image: "https://a-static.mlcdn.com.br/800x560/kit-12-utensilios-de-cozinha-em-silicone-com-cabo-de-madeira-mk/lojakvell/kit12pc/149a04b5f112d87c6d5b908e4e5de2e6.jpeg", price_new: "R$55,43", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/kit-12-utensilios-de-cozinha-em-silicone-com-cabo-de-madeira-mk/p/dhdjhhg0f3/ud/cjtu/?seller_id=lojakvell" },
      { name: "Caixa Organizadora Multifuncional B-max", image: "https://a-static.mlcdn.com.br/800x560/caixa-organizador-multifuncional-gaveta-guarda-roupa-armario-decorativo-c-alca-tecido-retangular-closet-lavavel-cesto-b-max/aclsecommerce/p26558/5dbd09917ed63714612394c74dfa5604.jpeg", price_new: "R$27,99", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/caixa-organizador-multifuncional-gaveta-guarda-roupa-armario-decorativo-c-alca-tecido-retangular-closet-lavavel-cesto-b-max/p/fcdk77k86d/ud/orgm/?seller_id=aclsecommerce" },
      { name: "Luminária Abajur LED USB Recarregável", image: "https://a-static.mlcdn.com.br/800x560/luminaria-abajur-de-garrafa-led-mesa-recarregavel-usb-touch-portatil-iluminacao-ajustavel-decoracao-sala-escrivaninha-escritorio-casa-ab-midia/abmidia/25625p/7d6e207cfe39c7bae90c1bdef3e291d0.jpeg", price_new: "R$55,61", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/luminaria-abajur-de-garrafa-led-mesa-recarregavel-usb-touch-portatil-iluminacao-ajustavel-decoracao-sala-escrivaninha-escritorio-casa-ab-midia/p/deh4cj238f/cj/lume/?seller_id=abmidia" },
      { name: "Dispenser Automático Sabonete Euro Home", image: "https://a-static.mlcdn.com.br/800x560/dispenser-eletrico-automatico-para-sabonete-liquido-euro-home-sensor-sem-toque-higiene-inteligente-banheiro-cozinha/lojamegamixcompras/200397-006/f04a2414ae995d509ef926a48b133230.jpeg", price_new: "R$73,45", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/dispenser-eletrico-automatico-para-sabonete-liquido-euro-home-sensor-sem-toque-higiene-inteligente-banheiro-cozinha/p/ad86k7596b/pi/disa/?seller_id=lojamegamixcompras" },
      { name: "Porta Temperos Giratório 9 Potes Belakaza", image: "https://a-static.mlcdn.com.br/800x560/porta-temperos-e-condimentos-giratorio-com-9-potes-de-vidro-preto-belakaza/lojasestreladolar/106455812/e8a788bf6b0756e15c87cbe0370f9a8d.jpeg", price_new: "R$37,99", url: "https://www.magazinevoce.com.br/magazinedescobertaslar/porta-temperos-e-condimentos-giratorio-com-9-potes-de-vidro-preto-belakaza/p/ga32d7cb22/ud/port/?seller_id=lojasestreladolar" },
    ];
    // =====================================================================

    const grid = document.getElementById("weekly-grid");

    grid.innerHTML = products.map((p) => {
      const priceOld = p.price_old
        ? `<span class="price-old">${p.price_old}</span>`
        : "";

      return `
        <a class="deal-item" href="${p.url}" target="_blank">
          <div class="deal-icon">
            <img src="${p.image}" alt="${p.name}" loading="lazy">
          </div>
          <div class="deal-name">${p.name}</div>
          <div class="price-row">${priceOld}<span class="price-new">${p.price_new}</span></div>
        </a>
      `;
    }).join("");

    function shareTop9() {
      const names = products.map(p => `• ${p.name}`).join("\n");
      const text = `Top 9 achadinhos da semana no descobertas.pro.lar 🏠\n\n${names}\n\n${window.location.href}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
    }
  </script>
</body>
</html>
